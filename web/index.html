<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title data-i18n="app.title">Année en famille</title>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1 data-i18n="app.title">Année en famille</h1>
    <div class="yearnav">
      <button id="prev" type="button" aria-label="Année précédente" data-i18n-attr="aria-label:year.prev">‹</button>
      <span id="yl" aria-live="polite"></span>
      <button id="next" type="button" aria-label="Année suivante" data-i18n-attr="aria-label:year.next">›</button>
    </div>
    <div class="seg" id="view" role="group" aria-label="Affichage" data-i18n-attr="aria-label:view.label">
      <button type="button" data-view="week" data-i18n="view.week">Semaines</button>
      <button type="button" data-view="month" data-i18n="view.month">Mois</button>
    </div>
  </div>
  <div class="legend" id="legend" role="group" aria-label="Catégories affichées" data-i18n-attr="aria-label:legend.label"></div>
  <div class="who" id="who" role="group" aria-label="Événements de" data-i18n-attr="aria-label:who.label"></div>
  <div class="actions">
    <div id="langSwitch"></div>
    <button class="btn" id="addBtn" type="button" data-i18n="btn.add">Ajouter un événement</button>
    <button class="btn ghost" id="printBtn" type="button" aria-expanded="false" aria-controls="printPop" data-i18n="btn.print">Imprimer</button>
    <a class="btn ghost" id="settings" href="/reglages" data-i18n="btn.settings">Réglages</a>
    <form method="post" action="/auth/logout"><button class="btn ghost" id="logout" type="submit" data-i18n="btn.logout">Se déconnecter</button></form>
    <button class="btn ghost" id="reset" type="button" hidden title="Remet les événements d’exemple de la démonstration." data-i18n="btn.reset" data-i18n-attr="title:btn.reset.title">Réinitialiser la démo</button>
    <form class="pop" id="printPop" hidden aria-label="Impression" data-i18n-attr="aria-label:print.aria">
      <label class="f"><span data-i18n="print.format">Format</span>
        <select id="printFormat">
          <option value="a3" selected data-i18n="print.a3">A3 paysage</option>
          <option value="a4" data-i18n="print.a4">A4 paysage</option>
        </select>
      </label>
      <div class="dlg-actions">
        <button type="button" class="btn ghost" id="printCancel" data-i18n="btn.cancel">Annuler</button>
        <button type="submit" class="btn" id="printGo" data-i18n="btn.print">Imprimer</button>
      </div>
    </form>
  </div>
</header>
<div class="print-head" id="printHead">
  <h1 data-i18n="app.title">Année en famille</h1>
  <span class="print-year" id="printYear"></span>
  <div class="legend" id="printLegend"></div>
  <p class="print-filters" id="printFilters" hidden></p>
</div>
<div class="banner" id="banner" role="alert" hidden>
  <span data-i18n="banner.error">Impossible de charger l’agenda.</span>
  <button class="btn sm" id="retry" type="button" data-i18n="btn.retry">Réessayer</button>
</div>
<main class="board" id="board">
  <p class="hint" data-i18n="hint.rotate">Tournez votre téléphone pour voir l’année entière.</p>
  <div class="canvas" id="canvas"></div>
</main>
<footer class="print-foot" id="printFoot"></footer>
<div class="tip" id="tip" role="tooltip"></div>
<aside class="panel" id="panel" aria-label="Détails" data-i18n-attr="aria-label:panel.aria">
  <button class="x" id="closePanel" type="button" aria-label="Fermer" data-i18n-attr="aria-label:panel.close">×</button>
  <div id="panelBody"></div>
</aside>
<dialog id="dlg" aria-labelledby="dlgTitle">
  <form id="form" novalidate>
    <h2 id="dlgTitle" data-i18n="dlg.new">Nouvel événement</h2>
    <label class="f"><span data-i18n="f.title">Titre</span><input id="fTitle" maxlength="120" placeholder="ex. Week-end à la maison de la plage" data-i18n-attr="placeholder:f.title.ph"></label>
    <label class="f"><span data-i18n="f.cat">Catégorie</span><select id="fCat"></select></label>
    <div class="two" id="fDates">
      <label class="f"><span data-i18n="f.start">Premier jour</span><input type="date" id="fStart"></label>
      <label class="f" id="fEndWrap"><span data-i18n="f.end">Dernier jour</span><input type="date" id="fEnd"></label>
    </div>
    <label class="f" id="fBirthWrap" hidden><span data-i18n="f.birth">Année de naissance</span><input type="number" id="fBirth" min="1900" step="1" inputmode="numeric" placeholder="facultatif" data-i18n-attr="placeholder:f.birth.ph"></label>
    <fieldset class="mem" id="fMem"><legend data-i18n="f.who">Qui est concerné ?</legend></fieldset>
    <label class="f"><span data-i18n="f.loc">Lieu</span><input id="fLoc" maxlength="200"></label>
    <label class="f"><span data-i18n="f.notes">Notes</span><textarea id="fNotes" rows="4" maxlength="2000"></textarea></label>
    <p class="err" id="fErr" role="alert"></p>
    <div class="dlg-actions">
      <button type="button" class="btn ghost" id="cancel" data-i18n="btn.cancel">Annuler</button>
      <button type="submit" class="btn" id="submit" data-i18n="dlg.add">Ajouter</button>
    </div>
  </form>
</dialog>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
