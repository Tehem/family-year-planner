<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Réglages · Année en famille</title>
</head>
<body class="settings-page">
<header class="top">
  <div class="brand">
    <h1>Réglages</h1>
  </div>
  <div class="actions">
    <a class="btn ghost" href="/">← Retour à l’année</a>
  </div>
</header>
<p class="err page-err" id="pageErr" role="alert" hidden></p>
<main class="settings" id="settings">
  <section class="set-card" aria-labelledby="hAgents">
    <h2 id="hAgents">Accès des agents</h2>

    <h3>Jetons personnels</h3>
    <div class="tbl-wrap" id="tokens"></div>
    <form class="inline-form" id="tokenForm" novalidate>
      <label class="f">Nom
        <input id="tokenName" maxlength="60" placeholder="ex. Grok API" autocomplete="off">
      </label>
      <fieldset class="mem rights">
        <legend>Droits</legend>
        <label><input type="radio" name="scope" value="read" checked> Lecture seule</label>
        <label><input type="radio" name="scope" value="read_write"> Lecture et écriture</label>
      </fieldset>
      <button class="btn" type="submit" id="tokenSubmit">Créer le jeton</button>
    </form>
    <p class="err" id="tokenErr" role="alert" hidden></p>
    <div id="newToken"></div>

    <h3>Connexions OAuth</h3>
    <div class="tbl-wrap" id="grants"></div>

    <h3>Adresse du serveur MCP</h3>
    <div id="mcp" class="copyrow"></div>
  </section>

  <section class="set-card" aria-labelledby="hKiosk">
    <h2 id="hKiosk">Tablette (mode kiosque)</h2>
    <p class="muted">Un lien kiosque ouvre l’année en lecture seule sur une tablette, sans connexion.</p>
    <div><button class="btn" type="button" id="kioskCreate">Créer un lien kiosque</button></div>
    <p class="err" id="kioskErr" role="alert" hidden></p>
    <div id="newKiosk"></div>
  </section>

  <section class="set-card" aria-labelledby="hImports">
    <h2 id="hImports">Imports</h2>
    <p class="muted" id="importStatus" role="status"></p>
    <div><button class="btn" type="button" id="importNow">Mettre à jour maintenant</button></div>
    <p class="err" id="importErr" role="alert" hidden></p>
    <div class="tbl-wrap" id="runs"></div>
  </section>
</main>

<dialog id="confirmDlg" aria-labelledby="confirmText">
  <form method="dialog" id="confirmForm">
    <h2 id="confirmText"></h2>
    <p class="muted">L’accès cesse immédiatement.</p>
    <p class="err" id="confirmErr" role="alert"></p>
    <div class="dlg-actions">
      <button type="button" class="btn ghost" id="confirmNo">Annuler</button>
      <button type="submit" class="btn danger" id="confirmYes">Révoquer</button>
    </div>
  </form>
</dialog>
<script type="module" src="/src/reglages-main.ts"></script>
</body>
</html>
