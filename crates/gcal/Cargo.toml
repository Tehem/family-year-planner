[package]
name = "annee-gcal"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
annee-domain = { version = "0.1.0", path = "../domain" }
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["sync", "time", "macros", "rt"] }
tracing = "0.1.44"

[dev-dependencies]
rand08 = { package = "rand", version = "0.8.8" }
rsa = { version = "0.9.10", features = ["pem"] }
tokio = { version = "1.53.3", features = ["full"] }
wiremock = "0.6.5"
