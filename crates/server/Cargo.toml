[package]
name = "annee-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "annee_server"
path = "src/lib.rs"

[[bin]]
name = "annee"
path = "src/main.rs"

[dependencies]
annee-domain = { version = "0.1.0", path = "../domain" }
annee-gcal = { version = "0.1.0", path = "../gcal" }
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie-private"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive", "env"] }
dashmap = "6.2.1"
ed25519-dalek = "3.0.0"
futures = "0.3.34"
governor = "0.10.4"
html-escape = "0.3.0"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
mime_guess = "2.0.5"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query", "form"] }
rmcp = { version = "3.5.1", features = ["transport-streamable-http-server"] }
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.53.3", features = ["full"] }
tokio-cron-scheduler = "0.15.1"
toml = "1.1.8"
tower-http = { version = "0.7.1", features = ["trace", "compression-full", "set-header", "cors", "request-id", "util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
rand08 = { package = "rand", version = "0.8.8" }
rsa = { version = "0.9.10", features = ["pem"] }
http-body-util = "0.1.5"
rmcp = { version = "3.5.1", features = ["client", "transport-streamable-http-client-reqwest"] }
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"
