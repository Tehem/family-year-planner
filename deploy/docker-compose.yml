services:
  annee:
    image: ghcr.io/OWNER/family-year-planner:latest   # replace OWNER by your GitHub user or organisation (lowercase)
    env_file: .env
    volumes:
      - ./config:/config:ro
      - ./secrets:/secrets:ro
      - ./data:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/annee", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - annee
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
